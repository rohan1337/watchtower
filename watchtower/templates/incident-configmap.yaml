apiVersion: v1
kind: ConfigMap
metadata:
    name: incident-config
    # prettier-ignore
    namespace: {{ .Values.namespace }}
data:
    PORT: "{{ .Values.incident.port }}"
    REDIS_HOST: "{{ .Values.redis.config.host }}"
    REDIS_PORT: "{{ .Values.redis.config.port }}"
    FRONTEND_URL: "{{ .Values.global.FRONTEND_URL }}"
    AUTH_URL: "{{ .Values.global.AUTH_URL }}"
    NODE_ENV: "{{ .Values.global.NODE_ENV }}"
