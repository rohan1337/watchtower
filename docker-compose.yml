name: watchtower

services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - watchtower-postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - watchtower-network

    redis:
        image: redis:8.2-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - watchtower-redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - watchtower-network

    auth-migrate:
        image: watchtower-auth-service
        build: ./backend/services/auth-service
        depends_on:
            postgres:
                condition: service_healthy
        env_file:
            - ./backend/services/auth-service/.env.production.local
        command: >
            sh -c "
            echo 'Waiting for Postgres...' &&
            until pg_isready -h postgres -U postgres; do
                sleep 2
            done &&
            echo 'Running migrations...' &&
            npx prisma migrate deploy &&
            echo 'Done!'
            "
        networks:
            - watchtower-network

    auth-service:
        image: watchtower-auth-service
        build: ./backend/services/auth-service
        restart: unless-stopped
        env_file:
            - ./backend/services/auth-service/.env.production.local
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            auth-migrate:
                condition: service_completed_successfully
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=watchtower-network"
            # - "traefik.http.routers.auth.tls=true"
            - "traefik.http.services.auth.loadbalancer.server.port=3001"
        networks:
            - watchtower-network
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        mem_limit: 512m

    incident-migrate:
        image: watchtower-incident-service
        build: ./backend/services/incident-service
        depends_on:
            postgres:
                condition: service_healthy
        env_file:
            - ./backend/services/incident-service/.env.production.local
        command: >
            sh -c "
            echo 'Waiting for Postgres...' &&
            until pg_isready -h postgres -U postgres; do
                sleep 2
            done &&
            echo 'Running migrations...' &&
            npx prisma migrate deploy &&
            echo 'Done!'
            "
        networks:
            - watchtower-network

    incident-service:
        image: watchtower-incident-service
        build: ./backend/services/incident-service
        restart: unless-stopped
        env_file:
            - ./backend/services/incident-service/.env.production.local
        depends_on:
            auth-service:
                condition: service_started
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            auth-migrate:
                condition: service_completed_successfully
            incident-migrate:
                condition: service_completed_successfully
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=watchtower-network"
            # - "traefik.http.routers.incident.tls=true"
            - "traefik.http.services.incident.loadbalancer.server.port=3003"
        networks:
            - watchtower-network
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        mem_limit: 512m

    notification-service:
        image: watchtower-notification-service
        build: ./backend/services/notification-service
        restart: unless-stopped
        env_file:
            - ./backend/services/notification-service/.env.production.local
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - watchtower-network
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        mem_limit: 512m

    frontend:
        image: watchtower-frontend
        build: ./frontend
        restart: unless-stopped
        env_file:
            - ./frontend/.env.production
        # environment:
        #     - NODE_TLS_REJECT_UNAUTHORIZED=0 # Add this line
        depends_on:
            - auth-service
            - incident-service
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=watchtower-network"
            # - "traefik.http.routers.frontend.tls=true"
            - "traefik.http.services.frontend.loadbalancer.server.port=3000"
        extra_hosts:
            - "watchtower.local:host-gateway"
        # OR, if host-gateway fails, use the Traefik service name:
        networks:
            watchtower-network:
                aliases:
                    - watchtower.local
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # nginx:
    #     image: nginx:1.28-alpine
    #     restart: unless-stopped
    #     ports:
    #         - "80:80"
    #         - "443:443"
    #     volumes:
    #         - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    #         - ./certs:/etc/nginx/certs
    #     depends_on:
    #         - frontend
    #         - auth-service
    #         - incident-service
    #     networks:
    #         - watchtower-network

    docker-proxy:
        image: tecnativa/docker-socket-proxy
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        environment:
            - CONTAINERS=1
            - SERVICES=1
            - NETWORKS=1
            - NODES=1
        networks:
            - watchtower-network

    traefik:
        image: traefik:v3.0
        restart: unless-stopped
        command:
            - "--api.insecure=false"
            - "--api.dashboard=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.endpoint=tcp://docker-proxy:2375"
            # IMPORTANT: This flag often fixes the "Error from daemon" on Windows
            - "--providers.docker.httpClientTimeout=300s"
            - "--providers.file.filename=/etc/traefik/dynamic.yml"
            - "--providers.file.watch=true"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
            - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
        ports:
            - "80:80"
            - "443:443"
            # - "7070:8080"
        volumes:
            - ./certs:/certs
            - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml
        depends_on:
            - docker-proxy
        networks:
            - watchtower-network

networks:
    watchtower-network:
        name: watchtower-network
        driver: bridge

volumes:
    watchtower-postgres-data:
        name: watchtower-postgres-data
    watchtower-redis-data:
        name: watchtower-redis-data
