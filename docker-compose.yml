name: watchtower

services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - watchtower-postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - watchtower-network

    redis:
        image: redis:8.2-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - watchtower-redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - watchtower-network
    auth-migrate:
        image: watchtower-auth-service
        build: ./backend/services/auth-service
        depends_on:
            postgres:
                condition: service_healthy
        env_file:
            - ./backend/services/auth-service/.env.production.local
        command: >
            sh -c "
            echo 'Waiting for Postgres...' &&
            until pg_isready -h postgres -U postgres && \
                    psql -h postgres -U postgres -c '\l' > /dev/null 2>&1; do
                sleep 2
            done &&
            echo 'Running migrations...' &&
            npx prisma migrate deploy &&
            echo 'Done!'
            "
        networks:
            - watchtower-network

    auth-service:
        image: watchtower-auth-service
        build: ./backend/services/auth-service
        restart: unless-stopped
        env_file:
            - ./backend/services/auth-service/.env.production.local
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            auth-migrate:
                condition: service_completed_successfully
        networks:
            - watchtower-network
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        mem_limit: 512m

    incident-migrate:
        image: watchtower-incident-service
        build: ./backend/services/incident-service
        depends_on:
            postgres:
                condition: service_healthy
        env_file:
            - ./backend/services/incident-service/.env.production.local
        command: >
            sh -c "
            echo 'Waiting for Postgres...' &&
            until pg_isready -h postgres -U postgres && \
                    psql -h postgres -U postgres -c '\l' > /dev/null 2>&1; do
                sleep 2
            done &&
            echo 'Running migrations...' &&
            npx prisma migrate deploy &&
            echo 'Done!'
            "
        networks:
            - watchtower-network

    incident-service:
        image: watchtower-incident-service
        build: ./backend/services/incident-service
        restart: unless-stopped
        env_file:
            - ./backend/services/incident-service/.env.production.local
        depends_on:
            auth-service:
                condition: service_started
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            auth-migrate:
                condition: service_completed_successfully
            incident-migrate:
                condition: service_completed_successfully
        networks:
            - watchtower-network
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        mem_limit: 512m

    notification-service:
        image: watchtower-notification-service
        build: ./backend/services/notification-service
        restart: unless-stopped
        env_file:
            - ./backend/services/notification-service/.env.production.local
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - watchtower-network
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        mem_limit: 512m

    frontend:
        image: watchtower-frontend
        build: ./frontend
        restart: unless-stopped
        env_file:
            - ./frontend/.env.production
        depends_on:
            - auth-service
            - incident-service
        networks:
            - watchtower-network
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    nginx:
        image: nginx:1.28-alpine
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - frontend
            - auth-service
            - incident-service
        networks:
            - watchtower-network

networks:
    watchtower-network:
        name: watchtower-network
        driver: bridge

volumes:
    watchtower-postgres-data:
        name: watchtower-postgres-data
    watchtower-redis-data:
        name: watchtower-redis-data
