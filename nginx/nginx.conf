worker_processes auto;

events {
    worker_connections 1024;
}

http {
	gzip on;
	gzip_types text/plain text/css application/json application/javascript application/xml;

	upstream frontend {
		server frontend:3000;
	}

	upstream auth {
		server auth-service:3001;
	}

	upstream incident {
		server incident-service:3003;
	}

	server {
		listen 80;
		server_name watchtower.local;

		return 307 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name watchtower.local;

		ssl_certificate /etc/nginx/certs/watchtower.local.pem;
		ssl_certificate_key /etc/nginx/certs/watchtower.local-key.pem;

		access_log /var/log/nginx/access.log;
		error_log /var/log/nginx/error.log;

		location / {
			proxy_pass http://frontend;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/auth {
			proxy_pass http://auth;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_http_version 1.1;
			proxy_request_buffering off;
		}

		location /api/tenants {
			proxy_pass http://auth;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_http_version 1.1;
			proxy_request_buffering off;
		}

		location /api/incidents {
			proxy_pass http://incident;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_http_version 1.1;
			proxy_request_buffering off;
		}

		location /api/alerts {
			proxy_pass http://incident;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_http_version 1.1;
			proxy_request_buffering off;
		}

		location /api/events {
			proxy_pass http://incident;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_http_version 1.1;
			proxy_request_buffering off;
		}

		location /api/integrations {
			proxy_pass http://incident;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_http_version 1.1;
			proxy_request_buffering off;
		}

		location /socket.io {
			proxy_pass http://incident;

			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";

			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_read_timeout 3600;
		}

		add_header X-Frame-Options SAMEORIGIN;
		add_header X-Content-Type-Options nosniff;
		add_header X-XSS-Protection "1; mode=block";
	}
}