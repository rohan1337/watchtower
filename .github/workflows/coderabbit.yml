name: CodeRabbit AI Review

on:
    pull_request:
        types: [opened, synchronize]

jobs:
    review:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Run CodeRabbit
              uses: coderabbitai/ai-pr-reviewer@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
