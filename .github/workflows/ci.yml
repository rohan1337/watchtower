name: Watchtower CI (GHCR)

on:
    push:
        branches:
            - development

permissions:
    contents: read
    packages: write # 🔥 REQUIRED for GHCR

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            # 1️⃣ Checkout
            - name: Checkout
              uses: actions/checkout@v4

            # 2️⃣ Login to GHCR
            - name: Login to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3️⃣ Build & Push Auth
            - name: Build & Push Auth
              run: |
                  docker build -t ghcr.io/${{ github.repository_owner }}/watchtower-auth-service:latest ./backend/services/auth-service
                  docker push ghcr.io/${{ github.repository_owner }}/watchtower-auth-service:latest

            # 4️⃣ Build & Push Incident
            - name: Build & Push Incident
              run: |
                  docker build -t ghcr.io/${{ github.repository_owner }}/watchtower-incident-service:latest ./backend/services/incident-service
                  docker push ghcr.io/${{ github.repository_owner }}/watchtower-incident-service:latest

            # 5️⃣ Build & Push Notification
            - name: Build & Push Notification
              run: |
                  docker build -t ghcr.io/${{ github.repository_owner }}/watchtower-notification-service:latest ./backend/services/notification-service
                  docker push ghcr.io/${{ github.repository_owner }}/watchtower-notification-service:latest

            # 6️⃣ Build & Push Frontend
            - name: Build & Push Frontend
              run: |
                  docker build -t ghcr.io/${{ github.repository_owner }}/watchtower-frontend:latest ./frontend
                  docker push ghcr.io/${{ github.repository_owner }}/watchtower-frontend:latest
