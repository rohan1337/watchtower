name: Watchtower CI (GHCR)

on:
    push:
        branches: [development]
    pull_request:
        branches: [development]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    secret-scan:
        name: 🔐 Secret Scan (Gitleaks)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    validate:
        name: 🧪 Validate Code
        runs-on: ubuntu-latest
        # secret-scan allows validate to run in parallel with secret-scan
        # needs: secret-scan

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            # - name: Lint
            #   run: npm run lint

            # - name: Run tests
            #   run: npm test

    build:
        name: 🐳 Build & Push Services
        runs-on: ubuntu-latest
        needs: [secret-scan, validate]

        strategy:
            matrix:
                service:
                    - name: auth-service
                      path: ./backend/services/auth-service
                    - name: incident-service
                      path: ./backend/services/incident-service
                    - name: notification-service
                      path: ./backend/services/notification-service
                    - name: frontend
                      path: ./frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Scan Filesystem (pre-build)
              uses: aquasecurity/trivy-action@v0.20.0
              with:
                  scan-type: fs
                  scan-ref: ${{ matrix.service.path }}
                  exit-code: 1

            - name: Build Image (local only)
              uses: docker/build-push-action@v5
              with:
                  context: ${{ matrix.service.path }}
                  push: false
                  load: true
                  tags: |
                      watchtower-${{ matrix.service.name }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      ${{ matrix.service.name == 'frontend' && 'NEXT_PUBLIC_API_BASE_URL_AUTH_SER=/api' || '' }}
                      ${{ matrix.service.name == 'frontend' && 'NEXT_PUBLIC_API_BASE_URL_INCIDENT_SER=/api' || '' }}

            - name: Scan Image (Trivy)
              uses: aquasecurity/trivy-action@v0.20.0
              with:
                  image-ref: watchtower-${{ matrix.service.name }}:${{ github.sha }}
                  exit-code: 1
                  severity: CRITICAL,HIGH

            - name: Tag for GHCR
              run: |
                  docker tag watchtower-${{ matrix.service.name }}:${{ github.sha }} \
                  ghcr.io/${{ github.repository_owner }}/watchtower-${{ matrix.service.name }}:${{ github.sha }}

            - name: Push Image
              run: |
                  docker push ghcr.io/${{ github.repository_owner }}/watchtower-${{ matrix.service.name }}:${{ github.sha }}              run: |
                  docker push ghcr.io/${{ github.repository_owner }}/watchtower-${{ matrix.service.name }}:${{ github.sha }}
