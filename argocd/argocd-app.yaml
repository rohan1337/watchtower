apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: watchtower
    namespace: argocd
spec:
    project: default

    source:
        repoURL: https://github.com/rohan1337/watchtower
        targetRevision: development
        path: watchtower

    destination:
        server: https://kubernetes.default.svc
        namespace: watchtower

    syncPolicy:
        automated:
            prune: true
            selfHeal: true
