apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: watchtower
    namespace: argocd
    annotations:
        argocd-image-updater.argoproj.io/image-list: frontend=ghcr.io/rohan1337/watchtower-frontend
        argocd-image-updater.argoproj.io/frontend.update-strategy: latest
        argocd-image-updater.argoproj.io/frontend.pull-secret: pullsecret:argocd/watchtower-repo
        argocd-image-updater.argoproj.io/frontend.helm.image-name: frontend.image.repository
        argocd-image-updater.argoproj.io/frontend.helm.image-tag: frontend.image.tag
spec:
    project: default

    source:
        repoURL: https://github.com/rohan1337/watchtower
        targetRevision: development
        path: watchtower

    destination:
        server: https://kubernetes.default.svc
        namespace: watchtower

    syncPolicy:
        automated:
            prune: true
            selfHeal: true

# To apply this ArgoCD application, run the following command:
# kubectl apply -f argocd/argocd-app.yaml
